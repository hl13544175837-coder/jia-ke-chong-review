<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1180" viewBox="0 0 2200 1180" role="img" aria-labelledby="title desc">
  <title id="title">智聘招聘数据流转泳道图</title>
  <desc id="desc">招聘需求、候选人、面试、录用和入职数据在各角色与系统之间的流转。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L0 8 8 4z" fill="#42617d"/></marker>
    <marker id="futureArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L0 8 8 4z" fill="#c46c13"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17324d}.title{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#56708a}.phase{font-size:16px;font-weight:700;fill:#42617d}.lane{font-size:18px;font-weight:700}.laneSub{font-size:13px;fill:#65809a}.nodeTitle{font-size:15px;font-weight:700}.nodeData{font-size:12px;fill:#506b83}.packet{font-size:12px;font-weight:700}.edge{fill:none;stroke:#42617d;stroke-width:2.2;marker-end:url(#arrow)}.future{fill:none;stroke:#c46c13;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#futureArrow)}.reject{fill:none;stroke:#c64154;stroke-width:2.2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="2200" height="1180" fill="#f8fafc"/>
  <text x="54" y="62" class="title">智聘招聘数据流转泳道图</text><text x="54" y="92" class="sub">以飞书招聘主流程为业务基准｜箭头标签说明在角色和系统之间新增、读取或更新的数据</text>
  <rect x="1580" y="42" width="185" height="30" rx="15" fill="#e8f7ee" stroke="#35a065"/><text x="1602" y="62" class="packet" fill="#17653d">当前系统内数据</text><rect x="1785" y="42" width="210" height="30" rx="15" fill="#fff4e5" stroke="#d98a29" stroke-dasharray="5 3"/><text x="1807" y="62" class="packet" fill="#9b5811">后续外部数据同步</text>
  <g fill="#eff5fb" stroke="#d7e3ef"><rect x="210" y="128" width="270" height="46"/><rect x="480" y="128" width="290" height="46"/><rect x="770" y="128" width="300" height="46"/><rect x="1070" y="128" width="350" height="46"/><rect x="1420" y="128" width="330" height="46"/><rect x="1750" y="128" width="390" height="46"/></g>
  <text x="300" y="157" class="phase">1. 需求数据</text><text x="565" y="157" class="phase">2. 候选人数据</text><text x="855" y="157" class="phase">3. 筛选结论</text><text x="1170" y="157" class="phase">4. 面试数据</text><text x="1515" y="157" class="phase">5. 录用数据</text><text x="1885" y="157" class="phase">6. 入职数据</text>
  <g fill="#fff" stroke="#d7e3ef"><rect x="30" y="174" width="180" height="115"/><rect x="30" y="289" width="180" height="115"/><rect x="30" y="404" width="180" height="115"/><rect x="30" y="519" width="180" height="115"/><rect x="30" y="634" width="180" height="115"/><rect x="30" y="749" width="180" height="115"/><rect x="30" y="864" width="180" height="115"/></g>
  <g fill="#fff" stroke="#e4edf5"><rect x="210" y="174" width="1930" height="115"/><rect x="210" y="289" width="1930" height="115"/><rect x="210" y="404" width="1930" height="115"/><rect x="210" y="519" width="1930" height="115"/><rect x="210" y="634" width="1930" height="115"/><rect x="210" y="749" width="1930" height="115"/><rect x="210" y="864" width="1930" height="115"/></g>
  <g><text x="55" y="222" class="lane">用人部门</text><text x="55" y="248" class="laneSub">发起需求</text><text x="55" y="337" class="lane">招聘专员</text><text x="55" y="363" class="laneSub">维护招聘数据</text><text x="55" y="452" class="lane">业务筛选人</text><text x="55" y="478" class="laneSub">输出筛选结论</text><text x="55" y="567" class="lane">面试官</text><text x="55" y="593" class="laneSub">输出评价</text><text x="55" y="682" class="lane">候选人</text><text x="55" y="708" class="laneSub">确认安排与录用</text><text x="55" y="797" class="lane">招聘主管</text><text x="55" y="823" class="laneSub">审批</text><text x="55" y="912" class="lane">智聘系统</text><text x="55" y="938" class="laneSub">唯一数据来源</text></g>
  <!-- 数据节点 -->
  <g stroke="#35a065" fill="#f2fbf6"><rect x="250" y="197" width="180" height="70" rx="10"/><text x="266" y="222" class="nodeTitle">填写招聘需求</text><text x="266" y="246" class="nodeData">岗位、编制、到岗日期</text></g>
  <g stroke="#35a065" fill="#f2fbf6"><rect x="470" y="772" width="175" height="70" rx="10"/><text x="486" y="797" class="nodeTitle">审核需求</text><text x="486" y="821" class="nodeData">通过、驳回、关闭</text></g>
  <g stroke="#35a065" fill="#e8f7ee"><rect x="500" y="887" width="200" height="70" rx="10"/><text x="516" y="912" class="nodeTitle">需求单</text><text x="516" y="936" class="nodeData">待审批 / 招聘中 / 已关闭</text></g>
  <g stroke="#35a065" fill="#f2fbf6"><rect x="560" y="312" width="190" height="70" rx="10"/><text x="576" y="337" class="nodeTitle">收录简历</text><text x="576" y="361" class="nodeData">简历、来源、关联需求</text></g>
  <g stroke="#35a065" fill="#e8f7ee"><rect x="760" y="887" width="190" height="70" rx="10"/><text x="776" y="912" class="nodeTitle">候选人档案</text><text x="776" y="936" class="nodeData">待处理 / 初筛中 / 筛选中</text></g>
  <g stroke="#35a065" fill="#f2fbf6"><rect x="850" y="427" width="185" height="70" rx="10"/><text x="866" y="452" class="nodeTitle">业务筛选</text><text x="866" y="476" class="nodeData">匹配结论、淘汰原因</text></g>
  <g stroke="#35a065" fill="#e8f7ee"><rect x="1010" y="887" width="195" height="70" rx="10"/><text x="1026" y="912" class="nodeTitle">筛选记录</text><text x="1026" y="936" class="nodeData">通过 / 淘汰 / 转其他职位</text></g>
  <g stroke="#35a065" fill="#f2fbf6"><rect x="1100" y="312" width="195" height="70" rx="10"/><text x="1116" y="337" class="nodeTitle">创建面试任务</text><text x="1116" y="361" class="nodeData">时间、轮次、面试官</text></g>
  <g stroke="#35a065" fill="#f2fbf6"><rect x="1305" y="542" width="185" height="70" rx="10"/><text x="1321" y="567" class="nodeTitle">提交面试评价</text><text x="1321" y="591" class="nodeData">结论、评语、建议</text></g>
  <g stroke="#35a065" fill="#e8f7ee"><rect x="1260" y="887" width="200" height="70" rx="10"/><text x="1276" y="912" class="nodeTitle">面试任务与评价</text><text x="1276" y="936" class="nodeData">已安排 / 已完成 / 已反馈</text></g>
  <g stroke="#35a065" fill="#f2fbf6"><rect x="1500" y="312" width="185" height="70" rx="10"/><text x="1516" y="337" class="nodeTitle">拟定录用函</text><text x="1516" y="361" class="nodeData">薪资、入职日期、有效期</text></g>
  <g stroke="#35a065" fill="#f2fbf6"><rect x="1675" y="772" width="185" height="70" rx="10"/><text x="1691" y="797" class="nodeTitle">录用审批</text><text x="1691" y="821" class="nodeData">批准或退回草稿</text></g>
  <g stroke="#35a065" fill="#f2fbf6"><rect x="1810" y="657" width="185" height="70" rx="10"/><text x="1826" y="682" class="nodeTitle">答复录用函</text><text x="1826" y="706" class="nodeData">接受、拒绝、撤回</text></g>
  <g stroke="#35a065" fill="#e8f7ee"><rect x="1520" y="887" width="210" height="70" rx="10"/><text x="1536" y="912" class="nodeTitle">录用记录</text><text x="1536" y="936" class="nodeData">草稿 / 审批中 / 已发放 / 已接受</text></g>
  <g stroke="#35a065" fill="#e8f7ee"><rect x="1840" y="887" width="220" height="70" rx="10"/><text x="1856" y="912" class="nodeTitle">入职记录与编制</text><text x="1856" y="936" class="nodeData">待入职 / 已入职 / 需求关闭</text></g>
  <!-- 数据流转箭头与数据包说明 -->
  <path class="edge" d="M430 232 C455 232 435 807 470 807"/><text x="435" y="500" class="packet">写入：需求单（待审批）</text>
  <path class="edge" d="M557 842 C590 842 585 887 600 887"/><text x="610" y="865" class="packet">更新：审批结论</text>
  <path class="edge" d="M645 807 C700 807 690 347 560 347"/><text x="670" y="575" class="packet">读取：有效需求</text>
  <path class="edge" d="M750 347 C780 347 760 922 760 922"/><text x="760" y="620" class="packet">写入：候选人档案</text>
  <path class="edge" d="M950 922 C985 922 970 462 850 462"/><text x="970" y="670" class="packet">派发：筛选任务</text>
  <path class="edge" d="M1035 462 C1070 462 1045 922 1010 922"/><text x="1050" y="675" class="packet">写入：筛选结论</text>
  <path class="edge" d="M1205 922 C1250 922 1210 347 1100 347"/><text x="1210" y="655" class="packet">读取：通过候选人</text>
  <path class="edge" d="M1295 347 C1335 347 1290 922 1260 922"/><text x="1310" y="670" class="packet">写入：面试任务</text>
  <path class="edge" d="M1395 612 C1415 680 1380 800 1360 887"/><text x="1410" y="755" class="packet">写入：评价</text>
  <path class="edge" d="M1460 922 C1500 922 1460 347 1500 347"/><text x="1465" y="655" class="packet">读取：已反馈结论</text>
  <path class="edge" d="M1685 347 C1720 347 1670 807 1675 807"/><text x="1685" y="570" class="packet">提交：录用审批单</text>
  <path class="edge" d="M1860 807 C1900 807 1775 922 1730 922"/><text x="1795" y="865" class="packet">更新：已批准 / 退回</text>
  <path class="edge" d="M1730 922 C1790 922 1770 692 1810 692"/><text x="1770" y="810" class="packet">发送：录用函数据</text>
  <path class="edge" d="M1900 727 C1930 770 1920 850 1940 887"/><text x="1940" y="810" class="packet">写入：答复与入职日期</text>
  <path class="reject" d="M950 957 C1030 1050 1190 1050 1230 957"/><text x="1040" y="1035" class="packet" fill="#c64154">淘汰或转岗：保留原因与去向</text>
  <!-- 后续外部数据同步 -->
  <rect x="1080" y="1015" width="260" height="55" rx="10" fill="#fff4e5" stroke="#d98a29" stroke-dasharray="6 4"/><text x="1096" y="1038" class="nodeTitle" fill="#9b5811">企业微信：面试日程与评价</text><text x="1096" y="1058" class="nodeData">同步面试任务、提醒、评价回传</text><path class="future" d="M1360 887 L1220 1070"/>
  <rect x="1510" y="1015" width="250" height="55" rx="10" fill="#fff4e5" stroke="#d98a29" stroke-dasharray="6 4"/><text x="1526" y="1038" class="nodeTitle" fill="#9b5811">办公审批：录用审批数据</text><text x="1526" y="1058" class="nodeData">审批结果回写录用记录</text><path class="future" d="M1720 842 L1635 1015"/>
  <rect x="1830" y="1015" width="230" height="55" rx="10" fill="#fff4e5" stroke="#d98a29" stroke-dasharray="6 4"/><text x="1846" y="1038" class="nodeTitle" fill="#9b5811">人事系统：入职与编制</text><text x="1846" y="1058" class="nodeData">实际入职、组织、编制同步</text><path class="future" d="M1950 957 L1950 1015"/>
  <text x="54" y="1130" class="sub">研发使用方式：每个数据包对应一个可追踪的业务记录；任何状态变更都写回智聘系统，再由后续外部服务同步或回传。</text>
</svg>
