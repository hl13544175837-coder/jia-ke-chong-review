<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2760" viewBox="0 0 2200 2760" role="img" aria-labelledby="title desc">
<title id="title">智聘招聘全流程状态流转图</title><desc id="desc">按连续招聘流程、主责角色、状态流转与接口情况四列展示的招聘全流程图。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L0 8 8 4z" fill="#477fe8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#19324d}.t{font-size:38px;font-weight:700}.s{font-size:17px;fill:#62778c}.h{font-size:22px;font-weight:700}.n{font-size:15px;font-weight:700}.ct{font-size:21px;font-weight:700}.d{font-size:15px;fill:#5d7287}.r{font-size:16px;font-weight:700}.ac{font-size:17px;font-weight:700}.i{font-size:16px;font-weight:700}.tag{font-size:13px;font-weight:700}.f{font-size:14px;fill:#5d7287}</style></defs>
<rect width="2200" height="2760" fill="#f7f9fc"/><rect x="62" y="48" width="9" height="88" rx="5" fill="#3d7bf0"/><text x="96" y="88" class="t">智聘招聘全流程状态流转图</text><text x="96" y="119" class="s">按连续招聘流程拆分 11 个环节｜每行明确主责角色、状态变化、当前页面与后续外部对接</text><text x="96" y="148" class="s">状态口径：候选人主状态与面试、录用子状态分别记录；红色表示终止或退回</text>
<rect x="1640" y="48" width="490" height="100" rx="12" fill="#fff" stroke="#ccd9e6"/><text x="1665" y="78" class="h">图例</text><rect x="1665" y="94" width="110" height="25" rx="13" fill="#dcecff"/><text x="1686" y="112" class="tag" fill="#2865bd">当前已具备</text><rect x="1790" y="94" width="110" height="25" rx="13" fill="#fff0be"/><text x="1811" y="112" class="tag" fill="#9b6800">后续待接入</text><rect x="1915" y="94" width="115" height="25" rx="13" fill="#fff0f1"/><text x="1935" y="112" class="tag" fill="#b33949">终止 / 退回</text>
<text x="62" y="210" class="h">连续招聘流程</text><rect x="62" y="220" width="150" height="4" rx="2" fill="#3d7bf0"/><text x="670" y="210" class="h">主责角色 / 权责</text><rect x="670" y="220" width="150" height="4" rx="2" fill="#7c52d9"/><text x="1090" y="210" class="h">状态流转与动作</text><rect x="1090" y="220" width="150" height="4" rx="2" fill="#21a170"/><text x="1700" y="210" class="h">对应页面 / 接口情况</text><rect x="1700" y="220" width="180" height="4" rx="2" fill="#e5a314"/>
<rect x="50" y="240" width="540" height="2280" rx="12" fill="#fff" stroke="#d5e0ed"/><rect x="640" y="240" width="390" height="2280" rx="12" fill="#fbfaff" stroke="#ddd8ed"/><rect x="1060" y="240" width="600" height="2280" rx="12" fill="#fff" stroke="#d5e0ed"/><rect x="1680" y="240" width="470" height="2280" rx="12" fill="#fff" stroke="#d5e0ed"/><path d="M105 335L105 2390" fill="none" stroke="#9ebdf6" stroke-width="7" stroke-linecap="round"/>

<!-- 第1行 --><g transform="translate(0 0)"><circle cx="105" cy="360" r="24" fill="#3d7bf0"/><text x="97" y="366" class="n" fill="#fff">1</text><rect x="140" y="295" width="420" height="130" rx="9" fill="#f9fbff" stroke="#7fa7ef" stroke-width="2"/><rect x="140" y="295" width="7" height="130" fill="#3d7bf0"/><text x="170" y="337" class="ct">创建并提交招聘需求</text><text x="170" y="370" class="d">岗位、编制、优先级、到岗日期</text><text x="170" y="396" class="d">状态：待审批</text><rect x="670" y="315" width="330" height="90" rx="8" fill="#fff" stroke="#d8d0eb"/><text x="695" y="350" class="r">用人部门</text><text x="695" y="384" class="d">发起需求，对岗位与编制负责</text><rect x="1090" y="315" width="540" height="90" rx="8" fill="#fff" stroke="#d7e1ea"/><text x="1115" y="350" class="ac">提交 → 待审批</text><text x="1115" y="384" class="d">校验通过后创建；退回后补充再提交</text><rect x="1710" y="315" width="410" height="90" rx="8" fill="#eef6ff" stroke="#8ab2eb"/><text x="1735" y="350" class="i">需求创建与提交</text><text x="1735" y="384" class="d">当前已具备；办公审批同步待接入</text><path d="M105 384L105 465" fill="none" stroke="#477fe8" stroke-width="3" marker-end="url(#a)"/></g>
<!-- 第2行 --><g transform="translate(0 205)"><circle cx="105" cy="360" r="24" fill="#3d7bf0"/><text x="97" y="366" class="n" fill="#fff">2</text><rect x="140" y="295" width="420" height="130" rx="9" fill="#f9fbff" stroke="#7fa7ef" stroke-width="2"/><rect x="140" y="295" width="7" height="130" fill="#3d7bf0"/><text x="170" y="337" class="ct">审核需求并生效</text><text x="170" y="370" class="d">通过、驳回、关闭或补充信息</text><text x="170" y="396" class="d">通过后可关联简历并推进招聘</text><rect x="670" y="315" width="330" height="90" rx="8" fill="#fff" stroke="#d8d0eb"/><text x="695" y="350" class="r">招聘主管</text><text x="695" y="384" class="d">审核需求合理性并接手招聘任务</text><rect x="1090" y="315" width="540" height="90" rx="8" fill="#fff" stroke="#d7e1ea"/><text x="1115" y="350" class="ac">待审批 → 招聘中</text><text x="1115" y="384" class="d">驳回 → 待补充；关闭或编制满 → 已关闭</text><rect x="1710" y="315" width="410" height="90" rx="8" fill="#eef6ff" stroke="#8ab2eb"/><text x="1735" y="350" class="i">需求审批与关闭</text><text x="1735" y="384" class="d">当前已具备；外部审批回传待接入</text><path d="M105 384L105 465" fill="none" stroke="#477fe8" stroke-width="3" marker-end="url(#a)"/></g>
<!-- 第3行 --><g transform="translate(0 410)"><circle cx="105" cy="360" r="24" fill="#7c52d9"/><text x="97" y="366" class="n" fill="#fff">3</text><rect x="140" y="295" width="420" height="130" rx="9" fill="#fcfaff" stroke="#a88ae4" stroke-width="2"/><rect x="140" y="295" width="7" height="130" fill="#7c52d9"/><text x="170" y="337" class="ct">收录简历并关联需求</text><text x="170" y="370" class="d">上传、解析、校对候选人档案</text><text x="170" y="396" class="d">成功后进入待处理</text><rect x="670" y="315" width="330" height="90" rx="8" fill="#fff" stroke="#d8d0eb"/><text x="695" y="350" class="r">招聘专员</text><text x="695" y="384" class="d">关联需求，修正解析结果</text><rect x="1090" y="315" width="540" height="90" rx="8" fill="#fff" stroke="#d7e1ea"/><text x="1115" y="350" class="ac">解析成功 → 待处理</text><text x="1115" y="384" class="d">解析失败保留原件与记录，可重新处理</text><rect x="1710" y="315" width="410" height="90" rx="8" fill="#eef6ff" stroke="#8ab2eb"/><text x="1735" y="350" class="i">简历上传与解析</text><text x="1735" y="384" class="d">当前已具备；解析质量持续校验</text><path d="M105 384L105 465" fill="none" stroke="#477fe8" stroke-width="3" marker-end="url(#a)"/></g>
<!-- 第4行 --><g transform="translate(0 615)"><circle cx="105" cy="360" r="24" fill="#7c52d9"/><text x="97" y="366" class="n" fill="#fff">4</text><rect x="140" y="295" width="420" height="130" rx="9" fill="#fcfaff" stroke="#a88ae4" stroke-width="2"/><rect x="140" y="295" width="7" height="130" fill="#7c52d9"/><text x="170" y="337" class="ct">初筛并推送业务筛选</text><text x="170" y="370" class="d">通过初筛后分配业务筛选人</text><text x="170" y="396" class="d">淘汰或转其他职位保留原因</text><rect x="670" y="315" width="330" height="90" rx="8" fill="#fff" stroke="#d8d0eb"/><text x="695" y="350" class="r">招聘专员</text><text x="695" y="384" class="d">初筛候选人并分配业务筛选人</text><rect x="1090" y="315" width="540" height="90" rx="8" fill="#fff" stroke="#d7e1ea"/><text x="1115" y="350" class="ac">待处理 → 初筛中 → 业务筛选中</text><text x="1115" y="384" class="d">不通过 → 已淘汰；可转入其他职位</text><rect x="1710" y="315" width="410" height="90" rx="8" fill="#eef6ff" stroke="#8ab2eb"/><text x="1735" y="350" class="i">初筛与业务筛选任务</text><text x="1735" y="384" class="d">当前已具备；企业微信任务卡待接入</text><path d="M105 384L105 465" fill="none" stroke="#477fe8" stroke-width="3" marker-end="url(#a)"/></g>
<!-- 第5行 --><g transform="translate(0 820)"><circle cx="105" cy="360" r="24" fill="#7c52d9"/><text x="97" y="366" class="n" fill="#fff">5</text><rect x="140" y="295" width="420" height="130" rx="9" fill="#fcfaff" stroke="#a88ae4" stroke-width="2"/><rect x="140" y="295" width="7" height="130" fill="#7c52d9"/><text x="170" y="337" class="ct">业务筛选并返回结论</text><text x="170" y="370" class="d">查看简历并判断业务匹配度</text><text x="170" y="396" class="d">通过进入面试；淘汰结束</text><rect x="670" y="315" width="330" height="90" rx="8" fill="#fff" stroke="#d8d0eb"/><text x="695" y="350" class="r">业务筛选人</text><text x="695" y="384" class="d">对业务适配性给出结论</text><rect x="1090" y="315" width="540" height="90" rx="8" fill="#fff" stroke="#d7e1ea"/><text x="1115" y="350" class="ac">业务筛选中 → 面试中 / 已淘汰</text><text x="1115" y="384" class="d">补充材料后可重新筛选，也可转其他职位</text><rect x="1710" y="315" width="410" height="90" rx="8" fill="#eef6ff" stroke="#8ab2eb"/><text x="1735" y="350" class="i">业务筛选结论提交</text><text x="1735" y="384" class="d">当前已具备；企业微信通知待接入</text><path d="M105 384L105 465" fill="none" stroke="#477fe8" stroke-width="3" marker-end="url(#a)"/></g>
<!-- 第6行 --><g transform="translate(0 1025)"><circle cx="105" cy="360" r="24" fill="#2193c8"/><text x="97" y="366" class="n" fill="#fff">6</text><rect x="140" y="295" width="420" height="130" rx="9" fill="#f8fdff" stroke="#75badc" stroke-width="2"/><rect x="140" y="295" width="7" height="130" fill="#2193c8"/><text x="170" y="337" class="ct">双方确认后创建面试安排</text><text x="170" y="370" class="d">确定时间、轮次、面试官与地点</text><text x="170" y="396" class="d">支持改约与取消</text><rect x="670" y="315" width="330" height="90" rx="8" fill="#fff" stroke="#d8d0eb"/><text x="695" y="350" class="r">招聘专员</text><text x="695" y="384" class="d">协调双方后创建面试任务</text><rect x="1090" y="315" width="540" height="90" rx="8" fill="#fff" stroke="#d7e1ea"/><text x="1115" y="350" class="ac">面试中 + 新建面试 → 已安排</text><text x="1115" y="384" class="d">改约后保持已安排；取消 → 已取消</text><rect x="1710" y="315" width="410" height="90" rx="8" fill="#fff9e8" stroke="#dfbd59" stroke-dasharray="6 4"/><text x="1735" y="350" class="i">面试安排、日程提醒</text><text x="1735" y="384" class="d">企业微信日程：后续待接入</text><path d="M105 384L105 465" fill="none" stroke="#477fe8" stroke-width="3" marker-end="url(#a)"/></g>
<!-- 第7行 --><g transform="translate(0 1230)"><circle cx="105" cy="360" r="24" fill="#2193c8"/><text x="97" y="366" class="n" fill="#fff">7</text><rect x="140" y="295" width="420" height="130" rx="9" fill="#f8fdff" stroke="#75badc" stroke-width="2"/><rect x="140" y="295" width="7" height="130" fill="#2193c8"/><text x="170" y="337" class="ct">确认面试执行状态</text><text x="170" y="370" class="d">已进行、取消、改约</text><text x="170" y="396" class="d">已完成的面试才能进入评价</text><rect x="670" y="315" width="330" height="90" rx="8" fill="#fff" stroke="#d8d0eb"/><text x="695" y="350" class="r">招聘专员 / 系统</text><text x="695" y="384" class="d">确认实际执行情况</text><rect x="1090" y="315" width="540" height="90" rx="8" fill="#fff" stroke="#d7e1ea"/><text x="1115" y="350" class="ac">已安排 → 已完成 → 待评价</text><text x="1115" y="384" class="d">取消 → 已取消；改约后回到已安排</text><rect x="1710" y="315" width="410" height="90" rx="8" fill="#fff9e8" stroke="#dfbd59" stroke-dasharray="6 4"/><text x="1735" y="350" class="i">执行确认与提醒</text><text x="1735" y="384" class="d">企业微信回执：后续待接入</text><path d="M105 384L105 465" fill="none" stroke="#477fe8" stroke-width="3" marker-end="url(#a)"/></g>
<!-- 第8行 --><g transform="translate(0 1435)"><circle cx="105" cy="360" r="24" fill="#2193c8"/><text x="97" y="366" class="n" fill="#fff">8</text><rect x="140" y="295" width="420" height="130" rx="9" fill="#f8fdff" stroke="#75badc" stroke-width="2"/><rect x="140" y="295" width="7" height="130" fill="#2193c8"/><text x="170" y="337" class="ct">面试官提交本轮评价</text><text x="170" y="370" class="d">通过 / 不通过、评价与建议</text><text x="170" y="396" class="d">协同面试官可补充</text><rect x="670" y="315" width="330" height="90" rx="8" fill="#fff" stroke="#d8d0eb"/><text x="695" y="350" class="r">主面试官</text><text x="695" y="384" class="d">提交反馈，本轮才视为完成</text><rect x="1090" y="315" width="540" height="90" rx="8" fill="#fff" stroke="#d7e1ea"/><text x="1115" y="350" class="ac">待评价 → 已反馈</text><text x="1115" y="384" class="d">未提交评价不可推进到下一轮或录用</text><rect x="1710" y="315" width="410" height="90" rx="8" fill="#eef6ff" stroke="#8ab2eb"/><text x="1735" y="350" class="i">面试评价提交</text><text x="1735" y="384" class="d">当前已具备；企业微信评价卡待接入</text><path d="M105 384L105 465" fill="none" stroke="#477fe8" stroke-width="3" marker-end="url(#a)"/></g>
<!-- 第9行 --><g transform="translate(0 1640)"><circle cx="105" cy="360" r="24" fill="#2193c8"/><text x="97" y="366" class="n" fill="#fff">9</text><rect x="140" y="295" width="420" height="130" rx="9" fill="#f8fdff" stroke="#75badc" stroke-width="2"/><rect x="140" y="295" width="7" height="130" fill="#2193c8"/><text x="170" y="337" class="ct">招聘专员确认处理结果</text><text x="170" y="370" class="d">下一轮、加面、淘汰或进入录用</text><text x="170" y="396" class="d">淘汰必须填写原因</text><rect x="670" y="315" width="330" height="90" rx="8" fill="#fff" stroke="#d8d0eb"/><text x="695" y="350" class="r">招聘专员</text><text x="695" y="384" class="d">汇总评价并决定后续推进方式</text><rect x="1090" y="315" width="540" height="90" rx="8" fill="#fff" stroke="#d7e1ea"/><text x="1115" y="350" class="ac">已反馈 → 下一轮 / 录用中</text><text x="1115" y="384" class="d">淘汰 → 已淘汰；加面回到已安排</text><rect x="1710" y="315" width="410" height="90" rx="8" fill="#eef6ff" stroke="#8ab2eb"/><text x="1735" y="350" class="i">候选人流程推进</text><text x="1735" y="384" class="d">当前已具备；多轮面试回路待验收</text><path d="M105 384L105 465" fill="none" stroke="#e59616" stroke-width="3" marker-end="url(#a)"/></g>
<!-- 第10行 --><g transform="translate(0 1845)"><circle cx="105" cy="360" r="24" fill="#e58a14"/><text x="92" y="366" class="n" fill="#fff">10</text><rect x="140" y="295" width="420" height="130" rx="9" fill="#fffaf2" stroke="#eba94d" stroke-width="2"/><rect x="140" y="295" width="7" height="130" fill="#e58a14"/><text x="170" y="337" class="ct">录用拟定、审批、发放与答复</text><text x="170" y="370" class="d">薪资、入职日期、有效期</text><text x="170" y="396" class="d">接受锁定名额；拒绝、撤回、过期释放</text><rect x="670" y="315" width="330" height="90" rx="8" fill="#fff" stroke="#d8d0eb"/><text x="695" y="350" class="r">招聘专员 / 招聘主管</text><text x="695" y="384" class="d">拟定、审批、发放并登记答复</text><rect x="1090" y="315" width="540" height="90" rx="8" fill="#fff" stroke="#d7e1ea"/><text x="1115" y="350" class="ac">草稿 → 审批中 → 已批准 → 已发放</text><text x="1115" y="384" class="d">已接受 / 已拒绝 / 已撤回 / 已过期</text><rect x="1710" y="315" width="410" height="90" rx="8" fill="#eef6ff" stroke="#8ab2eb"/><text x="1735" y="350" class="i">录用管理与状态变更</text><text x="1735" y="384" class="d">当前已具备；签署与答复回传待接入</text><path d="M105 384L105 465" fill="none" stroke="#24a06d" stroke-width="3" marker-end="url(#a)"/></g>
<!-- 第11行 --><g transform="translate(0 2050)"><circle cx="105" cy="360" r="24" fill="#24a06d"/><text x="92" y="366" class="n" fill="#fff">11</text><rect x="140" y="295" width="420" height="130" rx="9" fill="#f4fcf8" stroke="#64bd91" stroke-width="2"/><rect x="140" y="295" width="7" height="130" fill="#24a06d"/><text x="170" y="337" class="ct">确认实际入职并关闭需求</text><text x="170" y="370" class="d">登记实际入职日期，更新编制</text><text x="170" y="396" class="d">未到岗可释放名额或重新招聘</text><rect x="670" y="315" width="330" height="90" rx="8" fill="#fff" stroke="#d8d0eb"/><text x="695" y="350" class="r">招聘专员</text><text x="695" y="384" class="d">确认入职，并按实际情况关闭需求</text><rect x="1090" y="315" width="540" height="90" rx="8" fill="#fff" stroke="#d7e1ea"/><text x="1115" y="350" class="ac">已接受 → 待入职 → 已入职</text><text x="1115" y="384" class="d">入职后占用编制；需求可转为已关闭</text><rect x="1710" y="315" width="410" height="90" rx="8" fill="#fff9e8" stroke="#dfbd59" stroke-dasharray="6 4"/><text x="1735" y="350" class="i">入职回写与需求关闭</text><text x="1735" y="384" class="d">人事系统同步：后续待接入</text></g>
<rect x="640" y="2580" width="1510" height="130" rx="12" fill="#edf3f8"/><text x="670" y="2620" class="h">产品 / 研发排期统一口径</text><text x="670" y="2655" class="f">状态由系统记录：需求、候选人、面试、录用分别保存；每次变更必须记录操作人、时间、原因。外部服务以回调、状态映射、失败重试为独立排期与验收项。</text><text x="62" y="2740" class="f">说明：实线卡片是当前产品内主流程；虚线卡片是企业微信、办公审批、人事系统等后续外部服务。图中所有展示名称均为中文。</text>
