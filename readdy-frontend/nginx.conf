limit_req_zone $binary_remote_addr zone=zhipin_login:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=zhipin_ai:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=zhipin_upload:10m rate=1r/s;

server {
    listen 8080;
    server_name localhost;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://zhipin-server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_req zone=zhipin_login burst=5 nodelay;
        proxy_pass http://zhipin-server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/agent/chat {
        limit_req zone=zhipin_ai burst=10 nodelay;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://zhipin-server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/resume/upload {
        limit_req zone=zhipin_upload burst=4 nodelay;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_pass http://zhipin-server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
