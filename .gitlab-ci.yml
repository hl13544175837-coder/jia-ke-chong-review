stages:
  - verify
  - build

# 依赖/浏览器下载缓存：lockfile 变化才失效，大幅减少 npm ci 与 playwright 下载耗时
variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-cache"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.pw-browsers"

cache:
  key:
    files:
      - readdy-frontend/package-lock.json
  paths:
    - .npm-cache/
    - .pip-cache/
    - .pw-browsers/
  policy: pull-push

frontendQuality:
  stage: verify
  interruptible: true
  timeout: 40m
  script:
    - node --version
    - npm --version
    - bash scripts/ci-npm-install.sh readdy-frontend
    - cd readdy-frontend
    - npm run test:contract
    - npm run type-check
    - npm run lint
    - npm run build
  tags:
    - t_FRONTEND
  only:
    - api
    - test
    - merge_requests

# 这组测试只覆盖不能出错的业务：身份权限、跨组织/跨专员数据隔离、
# 招聘主链、Offer 与 HC 数字、重复提交、简历原件/导出、审计留痕和注入防护。
# 它不跑大量页面样式检查，避免把发布时间花在低业务价值的用例上。
backendCriticalBusiness:
  stage: verify
  interruptible: true
  # 冷缓存时 Python 3.12 测试镜像最多准备 20 分钟，另留 10 分钟跑关键业务测试。
  timeout: 30m
  script:
    - export PYTHON_DOCKER_IMAGE="zhipin-ci-python:${CI_JOB_ID}"
    - export PYTHON_BASE_IMAGE="registry.ymdd.tech/library/python:3.12-uv"
    - bash scripts/ci-build-python-image.sh "$PYTHON_DOCKER_IMAGE"
    - >-
      sudo docker run --rm
      --network host
      --user "$(id -u):$(id -g)"
      -e HOME=/tmp
      -v "$CI_PROJECT_DIR:/workspace"
      -w /workspace
      "$PYTHON_DOCKER_IMAGE"
      python -m pytest -q
      backend/tests/test_auth_security.py
      backend/tests/test_auth_passwords.py
      backend/tests/test_access_control_hardening.py
      backend/tests/test_production_org_access_hardening.py
      backend/tests/test_security_candidate_scope.py
      backend/tests/test_security_hardening_next.py
      backend/tests/test_csv_export_security.py
      backend/tests/test_demand_scope_permissions.py
      backend/tests/test_demand_pipeline_isolation.py
      backend/tests/test_offer_lifecycle.py
      backend/tests/test_idempotency_keys.py
      backend/tests/test_audit_trail_pilot.py
      backend/tests/test_resume_database_storage.py
      backend/tests/test_resume_upload_duplicate_blocking.py
      backend/tests/test_resume_preview_ticket.py
      backend/tests/test_business_review_resume_access.py
      backend/tests/test_agent_import_auth.py
      backend/tests/test_agent_egress_security.py
      backend/tests/test_boss_command_injection.py
      backend/tests/test_gateway_dev_mock_injection.py
      backend/tests/test_gateway_trial_roles.py
      backend/tests/test_demand_p0_contract.py
      backend/tests/test_demand_scope_migration.py
      backend/tests/test_online_resume_imports.py
      backend/tests/test_config_validation.py
      backend/tests/test_demand_management.py::test_demands_can_be_created_listed_and_closed_with_metrics
      backend/tests/test_demand_management.py::test_closed_demands_can_be_restored_without_mutating_job_template
      backend/tests/test_demand_approval.py::test_interviewer_submits_pending_demand
      backend/tests/test_demand_approval.py::test_owner_hr_approves_pending_demand
      backend/tests/test_demand_approval.py::test_creator_resubmits_rejected_demand_and_history_is_audited
      backend/tests/test_interview_reschedule_workflow.py
      backend/tests/test_resume_recovery_workflow.py
      backend/tests/test_talent_map.py::test_talent_map_can_save_companies_people_and_filter_by_company
      backend/tests/test_talent_map.py::test_talent_maps_are_scoped_to_owner_unless_manager_or_admin
      backend/tests/test_talent_map.py::test_talent_map_organization_can_keep_empty_roles_and_rename_existing_people
      backend/tests/test_agent_conversations.py::test_agent_chat_creates_conversation_and_persists_messages
      backend/tests/test_agent_conversations.py::test_agent_conversation_mutations_are_user_and_org_scoped
      backend/tests/test_agent_conversations.py::test_agent_resume_after_relogin_only_needs_conversation_id
      backend/tests/test_agent_conversations.py::test_interviewer_cannot_access_agent_endpoints
      backend/tests/test_agent_safety_contract.py
      backend/tests/test_analytics_truth.py
      backend/tests/test_demand_bi_isolation.py::test_demand_bi_isolates_sibling_facts_and_labels_current_responsibility
      backend/tests/test_demand_bi_isolation.py::test_demand_bi_enforces_demand_owner_scope
      backend/tests/test_bi_operational_overview.py::test_team_overview_empty_state_is_successful_and_not_fabricated
      backend/tests/test_interview_loop.py::test_feedback_persists_structured_reason_tags
      backend/tests/test_business_reviews.py
      backend/tests/test_demand_interview_rounds.py::test_primary_feedback_completes_round_but_never_advances_pipeline
      backend/tests/test_demand_interview_rounds.py::test_only_one_active_primary_interviewer_per_round_sequence
      backend/tests/test_demand_interview_rounds.py::test_feedback_requires_an_assignment_for_the_current_actor
      backend/tests/test_interview_management_contract.py::test_future_interview_cannot_be_marked_conducted
      backend/tests/test_interview_management_contract.py::test_mark_conducted_is_explicit_idempotent_and_never_advances_pipeline
      backend/tests/test_candidate_journey.py
      backend/tests/test_core_trial_workflow.py
  after_script:
    - sudo docker rmi "zhipin-ci-python:${CI_JOB_ID}" || true
  tags:
    - t_FRONTEND
  only:
    - api
    - test
    - merge_requests

frontendBrowserSmoke:
  stage: verify
  interruptible: true
  # 冷缓存时两个隔离镜像各有 20 分钟硬上限，另留 5 分钟启动服务和跑核心冒烟。
  timeout: 45m
  script:
    - export PYTHON_DOCKER_IMAGE="zhipin-ci-python:${CI_JOB_ID}"
    - export PLAYWRIGHT_DOCKER_IMAGE="zhipin-ci-browser:${CI_JOB_ID}"
    - export PYTHON_BASE_IMAGE="registry.ymdd.tech/library/python:3.12-uv"
    - export NODE_BASE_IMAGE="registry.ymdd.tech/library/node:20-alpine"
    - bash scripts/ci-build-python-image.sh "$PYTHON_DOCKER_IMAGE"
    - bash scripts/ci-build-browser-image.sh "$PLAYWRIGHT_DOCKER_IMAGE"
    - bash scripts/ci-npm-install.sh readdy-frontend
    - >-
      PYTHON_DOCKER_IMAGE="$PYTHON_DOCKER_IMAGE"
      PLAYWRIGHT_DOCKER_IMAGE="$PLAYWRIGHT_DOCKER_IMAGE"
      bash scripts/run-isolated-browser-smoke.sh
  after_script:
    - sudo docker rm -f "zhipin-browser-smoke-${CI_JOB_ID}" || true
    - sudo docker rmi "zhipin-ci-python:${CI_JOB_ID}" || true
    - sudo docker rmi "zhipin-ci-browser:${CI_JOB_ID}" || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - readdy-frontend/playwright-report/
      - readdy-frontend/test-results/
  tags:
    - t_FRONTEND
  only:
    - api
    - test
    - merge_requests

buildTest:
  stage: build
  interruptible: true
  # Docker 拉取、构建和推送均受明确上限保护，避免 runner 无限挂起。
  timeout: 45m
  variables:
    rc_version: $PKG_TAG
    projectid: $CI_PROJECT_ID
    projectname: $CI_PROJECT_NAME
    jobid: $CI_JOB_ID
    pipelineid: $CI_PIPELINE_ID
    commitid: $CI_COMMIT_SHA
    envlabel: "new"
    tagname: $TagName

  script:
    - echo ${PWD}
    - export PKG_TAG="${PKG_TAG:-RC}"
    - export PKG_VERSION="${PKG_VERSION:-$(date +%Y%m%d%H%M)}"
    - make all PKG_TAG=$PKG_TAG PKG_VERSION=$PKG_VERSION
    - /deploy/script/ci/package.py $projectname  $PKG_TAG"_"$PKG_VERSION  $projectid $pipelineid $jobid ${PWD} ${commitid} $envlabel
    
  tags:
    - t_FRONTEND
  only:
    - api
    - test
