stages:
  - verify
  - build

frontendQuality:
  stage: verify
  script:
    - cd readdy-frontend
    - npm ci
    - npm run test:contract
    - npm run type-check
    - npm run lint
    - npm run build
  tags:
    - t_FRONTEND
  only:
    - api
    - test
    - merge_requests

frontendBrowserSmoke:
  stage: verify
  script:
    - cd readdy-frontend
    - npm ci
    - npx playwright install chromium
    - npm run test:e2e:smoke
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - readdy-frontend/playwright-report/
      - readdy-frontend/test-results/
  tags:
    - t_FRONTEND
  rules:
    - if: '$E2E_BASE_URL && $E2E_PASSWORD && ($CI_COMMIT_BRANCH == "api" || $CI_COMMIT_BRANCH == "test")'

buildTest:
  stage: build
  variables:
    rc_version: $PKG_TAG
    projectid: $CI_PROJECT_ID
    projectname: $CI_PROJECT_NAME
    jobid: $CI_JOB_ID
    pipelineid: $CI_PIPELINE_ID
    commitid: $CI_COMMIT_SHA
    envlabel: "new"
    tagname: $TagName

  script:
    - echo ${PWD}
    - export PKG_TAG="${PKG_TAG:-RC}"
    - export PKG_VERSION="${PKG_VERSION:-$(date +%Y%m%d%H%M)}"
    - make all PKG_TAG=$PKG_TAG PKG_VERSION=$PKG_VERSION
    - /deploy/script/ci/package.py $projectname  $PKG_TAG"_"$PKG_VERSION  $projectid $pipelineid $jobid ${PWD} ${commitid} $envlabel
    
  tags:
    - t_FRONTEND
  only:
    - api
